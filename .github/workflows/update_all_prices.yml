name: Обновление общего прайса Дром
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить секреты
        env:
          FOURTOCHKI_URL: ${{ secrets.FOURTOCHKI_URL }}
          SIBZAPASKA_USER: ${{ secrets.SIBZAPASKA_USER }}
          SIBZAPASKA_PASSWORD: ${{ secrets.SIBZAPASKA_PASSWORD }}
        run: |
          test -n "$FOURTOCHKI_URL" || (echo "Нет FOURTOCHKI_URL" && exit 1)
          test -n "$SIBZAPASKA_USER" || (echo "Нет SIBZAPASKA_USER" && exit 1)
          test -n "$SIBZAPASKA_PASSWORD" || (echo "Нет SIBZAPASKA_PASSWORD" && exit 1)

      - name: Подготовить каталоги
        run: |
          mkdir -p .build public

      - name: Получить 4tochki по МРЦ
        env:
          FOURTOCHKI_URL: ${{ secrets.FOURTOCHKI_URL }}
        run: |
          python drom_4tochki_converter.py \
            --output .build/4tochki.xml \
            --min-rest 4 \
            --set-size 4 \
            --available false

      - name: Получить Запаску
        env:
          SIBZAPASKA_USER: ${{ secrets.SIBZAPASKA_USER }}
          SIBZAPASKA_PASSWORD: ${{ secrets.SIBZAPASKA_PASSWORD }}
        run: |
          python sibzapaska_drom_converter.py .build/zapaska.xml

      - name: Объединить и удалить дубли
        run: |
          python merge_drom_prices.py \
            --fourtochki .build/4tochki.xml \
            --zapaska .build/zapaska.xml \
            --output public/drom_tires.xml \
            --min-offers 100

      - name: Проверить итоговый XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          f = "public/drom_tires.xml"
          root = ET.parse(f).getroot()
          n = len(root.findall("offer"))

          if n < 100:
              raise SystemExit(f"Подозрительно мало товаров: {n}")

          print(f"Итоговый прайс: {n} товаров")
          PY

      - name: Создать служебную страницу
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Шинный двор — общий прайс Дром</title>
          </head>
          <body>
            <h1>Шинный двор</h1>
            <p>Объединённый прайс 4tochki + Запаска без дублей.</p>
            <p><a href="drom_tires.xml">Открыть общий прайс</a></p>
          </body>
          </html>
          EOF

          touch public/.nojekyll

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Подготовить Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Опубликовать общий прайс
        id: deployment
        uses: actions/deploy-pages@v4
